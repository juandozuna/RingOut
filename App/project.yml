name: RingOut
options:
  bundleIdPrefix: com.juandozuna
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  RingOutEngine:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RingOut:
    type: application
    platform: iOS
    sources:
      - path: RingOut
    dependencies:
      - package: RingOutEngine
        product: RingOutEngine
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juandozuna.ringout
        PRODUCT_NAME: RingOut
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_OBJC_BRIDGING_HEADER: RingOut/Audio/RingOut-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RingOut/Resources/Info.plist
        CLANG_ENABLE_MODULES: YES
  RingOutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RingOutUITests
    dependencies:
      - target: RingOut
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  RingOut:
    build:
      targets:
        RingOut: all
        RingOutUITests: [test]
    test:
      targets:
        - RingOutUITests
